[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "nutribot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
