openapi: 3.0.3
info:
  title: Nutribot Payments API
  version: 1.0.0
  description: |
    API слоя платежной подсистемы Nutribot. Все POST-запросы требуют заголовок `Idempotency-Key`.
servers:
  - url: https://api.nutribot.local/api/orders
paths:
  /wallet/transactions/:
    get:
      summary: Список транзакций кошелька
      security:
        - bearerAuth: []
      parameters:
        - name: currency
          in: query
          schema:
            type: string
            enum: [STARS, CALO]
      responses:
        '200':
          description: OK
    post:
      summary: Резервировано (используйте topup/withdraw)
      security:
        - bearerAuth: []
      responses:
        '405':
          description: Не используется
  /wallet/transactions/topup/:
    post:
      summary: Пополнение кошелька
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  enum: [stars, calo]
                amount:
                  type: string
                description:
                  type: string
                reference:
                  type: string
      responses:
        '201':
          description: Пополнение создано
  /wallet/transactions/withdraw/:
    post:
      summary: Списание из кошелька
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                amount:
                  type: string
      responses:
        '201':
          description: Списание создано
  /wallet/topup/:
    post:
      summary: Инициировать пополнение через провайдера
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                amount:
                  type: string
                provider:
                  type: string
                  enum: [telegram_stars, card]
                metadata:
                  type: object
      responses:
        '201':
          description: Попытка оплаты создана
  /wallet/manual-stars/:
    post:
      summary: Ручное начисление Stars
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                source:
                  type: string
                metadata:
                  type: object
      responses:
        '201':
          description: Начисление выполнено
  /wallet/balances/:
    get:
      summary: Баланс и доступный остаток по валютам
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /wallet/summary/:
    get:
      summary: Сводка кошелька
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /orders/checkout/:
    post:
      summary: Создать заказ с оплатой
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, currency, amount, delivery_service, address, items]
              properties:
                title:
                  type: string
                description:
                  type: string
                kind:
                  type: string
                currency:
                  type: string
                  enum: [STARS, CALO]
                amount:
                  type: string
                delivery_service:
                  type: integer
                delivery_window:
                  type: integer
                delivery_date:
                  type: string
                  format: date
                address:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      menu_item_id:
                        type: integer
                      quantity:
                        type: string
                      unit_price:
                        type: string
      responses:
        '201':
          description: Заказ создан
  /subscriptions/{subscription_id}/enable_autopay/:
    post:
      summary: Включить автосписание
      security:
        - bearerAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Автосписание включено
  /subscriptions/{subscription_id}/disable_autopay/:
    post:
      summary: Выключить автосписание
      security:
        - bearerAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Автосписание выключено
  /subscriptions/{subscription_id}/charge/:
    post:
      summary: Принудительно списать оплату
      security:
        - bearerAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Результат списания
  /features/compose_recipe/purchase/:
    post:
      summary: Покупка функции Compose Recipe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                amount:
                  type: string
                metadata:
                  type: object
      responses:
        '201':
          description: Покупка успешна
  /webhooks/payments/telegram-stars/:
    post:
      summary: Webhook от Telegram Stars
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Обработано
  /webhooks/payments/card/:
    post:
      summary: Webhook от карточного провайдера
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Обработано
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer