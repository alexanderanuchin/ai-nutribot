[databases]
nutribot = host=db port=5432 dbname=nutribot pool_size=50 reserve_pool=10

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 5
server_idle_timeout = 30
server_lifetime = 600
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,geqo,search_path,default_tablespace
admin_users = postgres
stats_users = postgres
log_connections = 1
log_disconnections = 1
