services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nutribot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    command: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    restart: unless-stopped
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7

  backend:
    build: ../backend
    env_file: .env
    environment:
      FEED_TRANSLATE_RU_ENABLED: ${FEED_TRANSLATE_RU_ENABLED:-1}
      TRANSLATE_TARGET_LANG: ${TRANSLATE_TARGET_LANG:-ru}
      TRANSLATE_PROVIDERS: ${TRANSLATE_PROVIDERS:-yandex}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      TIME_DEFAULT_TZ: ${TIME_DEFAULT_TZ:-Europe/Moscow}
      POSTGRES_HOST: ${POSTGRES_HOST:-pgbouncer}
      POSTGRES_PORT: ${POSTGRES_PORT:-6432}
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-0}
      POSTGRES_CONN_HEALTH_CHECKS: ${POSTGRES_CONN_HEALTH_CHECKS:-1}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-prefer}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WEB_WORKERS: ${WEB_WORKERS:-2}
      WEB_THREADS: ${WEB_THREADS:-1}
      WEB_MAX_REQUESTS: ${WEB_MAX_REQUESTS:-1000}
      WEB_MAX_REQUESTS_JITTER: ${WEB_MAX_REQUESTS_JITTER:-100}
      WEB_GRACEFUL_TIMEOUT: ${WEB_GRACEFUL_TIMEOUT:-60}
      WEB_KEEPALIVE: ${WEB_KEEPALIVE:-5}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    mem_limit: 4g
    memswap_limit: 4g

  celery:
    build: ../backend
    env_file: .env
    environment:
      FEED_TRANSLATE_RU_ENABLED: ${FEED_TRANSLATE_RU_ENABLED:-1}
      TRANSLATE_TARGET_LANG: ${TRANSLATE_TARGET_LANG:-ru}
      TRANSLATE_PROVIDERS: ${TRANSLATE_PROVIDERS:-yandex}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      TIME_DEFAULT_TZ: ${TIME_DEFAULT_TZ:-Europe/Moscow}
      POSTGRES_HOST: ${POSTGRES_HOST:-pgbouncer}
      POSTGRES_PORT: ${POSTGRES_PORT:-6432}
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-0}
      POSTGRES_CONN_HEALTH_CHECKS: ${POSTGRES_CONN_HEALTH_CHECKS:-1}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-prefer}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
      CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
    command: ["/opt/venv/bin/celery", "-A", "nutribot", "worker", "-l", "info", "-Q", "default,feed.ingestion", "-c", "${CELERY_WORKER_CONCURRENCY:-4}", "--prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}"]
    depends_on:
      - backend
      - redis
      - pgbouncer

  celery-beat:
    build: ../backend
    env_file: .env
    environment:
      FEED_TRANSLATE_RU_ENABLED: ${FEED_TRANSLATE_RU_ENABLED:-1}
      TRANSLATE_TARGET_LANG: ${TRANSLATE_TARGET_LANG:-ru}
      TRANSLATE_PROVIDERS: ${TRANSLATE_PROVIDERS:-yandex}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      TIME_DEFAULT_TZ: ${TIME_DEFAULT_TZ:-Europe/Moscow}
      POSTGRES_HOST: ${POSTGRES_HOST:-pgbouncer}
      POSTGRES_PORT: ${POSTGRES_PORT:-6432}
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-0}
      POSTGRES_CONN_HEALTH_CHECKS: ${POSTGRES_CONN_HEALTH_CHECKS:-1}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-prefer}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["/opt/venv/bin/celery", "-A", "nutribot", "beat", "-l", "info", "-s", "/app/run/celerybeat-schedule"]
    depends_on:
      - backend
      - redis
      - pgbouncer

  bot:
    build: ../bot
    env_file: .env
    environment:
      BOT_HEALTHCHECK_URL: ${BOT_HEALTHCHECK_URL:-http://backend:8000/metrics}
    depends_on:
      - backend

  frontend:
    build: ../frontend
    environment:
      - VITE_API_BASE=/api
      - VITE_TELEGRAM_BOT_USERNAME=${BOT_USERNAME:-${TELEGRAM_BOT_USERNAME:-CaloIQ_bot}}

  gateway:
    image: nginx:1.27
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
    ports:
      - "8080:80"         # Локально смотришь http://localhost:8080
    depends_on:
      - backend
      - frontend

  # >>> добавили ПУБЛИКАЦИЮ ЧЕРЕЗ CLOUDPUB <<<
  cloudpub:
    image: cloudpub/cloudpub:latest
    container_name: cloudpub-agent
    depends_on:
      - gateway          # публикуем именно nginx-гейтвей
    environment:
      - TOKEN=${CLOUDPUB_TOKEN}
      - HTTP=gateway:80  # публикуем внутренний сервис gateway:80 наружу (HTTPS)
    command: run
    restart: unless-stopped
    volumes:
      - cloudpub-config:/home/cloudpub  # чтобы адрес CloudPub не менялся между рестартами

  acme:
    build:
      context: ./acme
    profiles:
      - acme
    env_file: .env
    environment:
      ACME_RENEW_INTERVAL: ${ACME_RENEW_INTERVAL:-43200}
    command: ["cron"]
    volumes:
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped

volumes:
  db-data:
  cloudpub-config:
  letsencrypt:
