# ====== infra/nginx.conf (stage 1: HTTP + ACME for caloiq.ru) ======
worker_processes  1;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;
  client_max_body_size 25m;
  large_client_header_buffers 8 32k;

  # X-Request-Id: пробрасываем из заголовка, иначе $request_id
  map $http_x_request_id $forwarded_request_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  # признак присутствия init-data (0/1) — для ваших API логов
  map $http_x_telegram_init_data $tg_init_present {
    ""      0;
    default 1;
  }

  # признак присутствия секретного заголовка Telegram webhook (0/1) — для отладки
  map $http_x_telegram_bot_api_secret_token $tg_secret_present {
    ""      0;
    default 1;
  }

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rid=$forwarded_request_id tg_present=$tg_init_present tg_secret=$tg_secret_present';

  access_log /var/log/nginx/access.log main;

  # Docker DNS
  resolver 127.0.0.11 ipv6=off valid=30s;
  resolver_timeout 2s;

  # WebSocket Upgrade helper
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---- upstreams ----
  upstream frontend_upstream {
    zone fe_zone 64k;
    server frontend:5173 resolve;
    keepalive 16;
  }

  upstream backend_upstream {
    zone be_zone 64k;
    server backend:8000 resolve;
    keepalive 16;
  }

  # БОТ: aiogram webhook на 8081
  upstream bot_upstream {
    zone bot_zone 64k;
    server bot:8081 resolve;
    keepalive 16;
  }

  # ----------------- HTTP only (stage 1) ----------------
  server {
    listen 80;
    server_name caloiq.ru www.caloiq.ru;

    # Let’s Encrypt HTTP-01 (stage 1)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
      try_files $uri =404;
    }

    # ---- API -> Django ----
    location /api/ {
      proxy_pass         http://backend_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Request-ID      $forwarded_request_id;
      proxy_set_header   X-Telegram-Init-Data $http_x_telegram_init_data;
      proxy_http_version 1.1;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_redirect     off;
    }

    # WebSocket -> Django
    location /ws/ {
      proxy_pass         http://backend_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Request-ID      $forwarded_request_id;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
      proxy_redirect     off;
    }

    # SSE -> Django
    location ~* ^/api/v1/(feed|market)/events/?$ {
      proxy_pass         http://backend_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Request-ID      $forwarded_request_id;
      proxy_http_version 1.1;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_set_header   Connection        "";
      chunked_transfer_encoding off;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
      proxy_redirect     off;
      add_header         X-Accel-Buffering no always;
    }

    # Telegram bridge SSE
    location ~* ^/api/users/telegram/bridge/stream/?$ {
      proxy_pass         http://backend_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Request-ID      $forwarded_request_id;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_buffering    off;
      proxy_cache        off;
      gzip               off;
      chunked_transfer_encoding off;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
      proxy_redirect     off;
      add_header         X-Accel-Buffering no always;
    }

    # ---- FRONT -> Vite dev server ----
    location / {
      proxy_pass         http://frontend_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_redirect     off;
    }

    # ---- BOT WEBHOOK ----
    # путь должен ТОЧНО совпадать с WEBHOOK_PATH и SimpleRequestHandler(path)
    location = /bot/webhook {
      limit_except POST { deny all; }

      proxy_pass         http://bot_upstream;  # без хвоста — прокинет оригинальный путь как есть
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;

      # таймауты для быстрых ответов Telegram
      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;
      proxy_send_timeout    30s;

      client_max_body_size  20m;
      proxy_redirect        off;
    }

    # (опционально) health для внутренней проверки
    location = /healthz {
      proxy_pass http://bot:8081/healthz;
      allow 127.0.0.1;
      allow 172.16.0.0/12;  # ваша docker-сеть
      deny all;
    }
  }
}
