# ====== infra/nginx.conf (полный) ======
worker_processes  1;

events { worker_connections 1024; }

http {
  # системные штуки
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;
  client_max_body_size 25m;
  large_client_header_buffers 8 32k;

  # Переносим X-Request-Id: берём из заголовка, иначе генерируемый $request_id
  map $http_x_request_id $forwarded_request_id {
    default $http_x_request_id;
    "" $request_id;
  }

  # Вместо perl_set считаем только признак присутствия init-data (0/1)
  map $http_x_telegram_init_data $tg_init_present {
    ""      0;
    default 1;
  }

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rid=$forwarded_request_id tg_present=$tg_init_present';

  access_log /var/log/nginx/access.log main;

  # Docker DNS
  resolver 127.0.0.11 ipv6=off valid=30s;
  resolver_timeout 2s;

  # Вспомогательная мапа для WebSocket Upgrade (Vite HMR, и на будущее)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---- upstreams ----
  upstream frontend_upstream {
    zone fe_zone 64k;
    server frontend:5173 resolve;
    keepalive 16;
  }

  upstream backend_upstream {
    zone be_zone 64k;
    server backend:8000 resolve;
    keepalive 16;
  }

  # ВНИМАНИЕ: бот по умолчанию у нас в режимe polling и НИЧЕГО не слушает по HTTP.
  # Если переведёшь бота на webhook (например, на 8081) — раскомментируй блок ниже
  # и соответствующий location /bot-webhook/.
  #
  # upstream bot_upstream {
  #   zone bot_zone 64k;
  #   server bot:8081 resolve;
  #   keepalive 16;
  # }

  server {
    listen 80;
    server_name _;

    # ---- API -> Django ----
    location /api/ {
      proxy_pass         http://backend_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-ID      $forwarded_request_id;
      proxy_set_header   X-Telegram-Init-Data $http_x_telegram_init_data;
      proxy_http_version 1.1;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_redirect     off;
    }

    location /ws/ {
      proxy_pass         http://backend_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-ID      $forwarded_request_id;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_redirect     off;
    }

    # SSE (event-stream) -> Django
    location ~* ^/api/v1/(feed|market)/events/?$ {
      proxy_pass         http://backend_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Request-ID      $forwarded_request_id;
      proxy_http_version 1.1;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_set_header   Connection        "";
      chunked_transfer_encoding off;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
      proxy_redirect     off;
      add_header         X-Accel-Buffering no always;
    }

    # ---- FRONT -> Vite dev server ----
    # Включаем корректный прокси для HMR (WebSocket)
    location / {
      proxy_pass         http://frontend_upstream;
      proxy_set_header   Host              $host;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_redirect     off;
    }

    # ---- BOT WEBHOOK (опционально) ----
    # Включай, только если реально поднимешь HTTP-сервер у бота (например, aiogram webhook на 8081):
    #
    # location /bot-webhook/ {
    #   proxy_pass         http://bot_upstream/;
    #   proxy_set_header   Host              $host;
    #   proxy_set_header   X-Real-IP         $remote_addr;
    #   proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #   proxy_http_version 1.1;
    #   proxy_read_timeout 60s;
    #   proxy_send_timeout 60s;
    #   proxy_redirect     off;
    # }
  }
}
